<h1>meeting-note-explainer</h1><main><figure><img src="stills/000_note.png"><figcaption><b>note</b> <code>00:00.9</code><br><q>Here is a fictional meeting</q><small>A paper note card slides in at centre. Chip: FICTIONAL NOTE · AUTHORED ILLUSTRATION.</small></figcaption></figure>
<figure><img src="stills/001_note.read.png"><figcaption><b>note.read</b> <code>00:03.3</code><br><q>Sam will send the draft</q><small>The note&#x27;s one line types on as it is spoken: &quot;Sam will send the draft on Friday.&quot;</small></figcaption></figure>
<figure><img src="stills/002_card.png"><figcaption><b>card</b> <code>00:06.0</code><br><q>Let&#x27;s turn it into an</q><small>The note moves to the left half. An empty ACTION CARD appears on the right with three blank rows: Action / Owner / Due.</small></figcaption></figure>
<figure><img src="stills/003_action.png"><figcaption><b>action</b> <code>00:08.4</code><br><q>First, the action.</q><small>The Action row lights in amber. The other two rows dim.</small></figcaption></figure>
<figure><img src="stills/004_action.find.png"><figcaption><b>action.find</b> <code>00:10.0</code><br><q>What needs to happen?</q><small>An amber underline sweeps under &quot;send the draft&quot; in the note.</small></figcaption></figure>
<figure><img src="stills/005_action.fill.png"><figcaption><b>action.fill</b> <code>00:11.5</code><br><q>Send the draft.</q><small>The underlined words lift off the note and drop into the Action row as &quot;Send the draft&quot;. A small check mark appears.</small></figcaption></figure>
<figure><img src="stills/006_owner.png"><figcaption><b>owner</b> <code>00:13.0</code><br><q>Next, the owner.</q><small>The Owner row lights in amber.</small></figcaption></figure>
<figure><img src="stills/007_owner.find.png"><figcaption><b>owner.find</b> <code>00:14.4</code><br><q>Who will do it?</q><small>An amber underline appears under &quot;Sam&quot; in the note.</small></figcaption></figure>
<figure><img src="stills/008_owner.fill.png"><figcaption><b>owner.fill</b> <code>00:15.5</code><br><q>Sam.</q><small>&quot;Sam&quot; drops into the Owner row. Check mark.</small></figcaption></figure>
<figure><img src="stills/009_due.png"><figcaption><b>due</b> <code>00:16.8</code><br><q>Then, the due day.</q><small>The Due row lights in amber.</small></figcaption></figure>
<figure><img src="stills/010_due.find.png"><figcaption><b>due.find</b> <code>00:18.4</code><br><q>When is it due?</q><small>An amber underline appears under &quot;Friday&quot; in the note.</small></figcaption></figure>
<figure><img src="stills/011_due.fill.png"><figcaption><b>due.fill</b> <code>00:19.6</code><br><q>Friday.</q><small>&quot;Friday&quot; drops into the Due row as plain text, with no date and no calendar. Check mark.</small></figcaption></figure>
<figure><img src="stills/012_check.png"><figcaption><b>check</b> <code>00:21.0</code><br><q>Now compare the card with</q><small>Side by side: the note on the left and the finished card on the right, the same size and level. Chip: CHECK AGAINST THE SOURCE.</small></figcaption></figure>
<figure><img src="stills/013_check.action.png"><figcaption><b>check.action</b> <code>00:23.3</code><br><q>Send the draft.</q><small>A line draws from the card&#x27;s Action row to &quot;send the draft&quot; in the note. Both glow.</small></figcaption></figure>
<figure><img src="stills/014_check.owner.png"><figcaption><b>check.owner</b> <code>00:24.5</code><br><q>Sam.</q><small>A line draws from Owner to &quot;Sam&quot;.</small></figcaption></figure>
<figure><img src="stills/015_check.due.png"><figcaption><b>check.due</b> <code>00:25.5</code><br><q>Friday.</q><small>A line draws from Due to &quot;Friday&quot;. The +0.6 offset is there because Whisper timed this &quot;Friday&quot; at 24.30, but the audio has it at about 24.9 (REVIEW.md).</small></figcaption></figure>
<figure><img src="stills/016_check.source.png"><figcaption><b>check.source</b> <code>00:26.8</code><br><q>Each field comes straight from</q><small>All three lines glow together. Every word on the card is now linked to the note.</small></figcaption></figure>
<figure><img src="stills/017_check.nothing.png"><figcaption><b>check.nothing</b> <code>00:30.2</code><br><q>Nothing was added.</q><small>A plate under the card reads: Nothing added. The card still has exactly three rows.</small></figcaption></figure>
<figure><img src="stills/018_check.end.png"><figcaption><b>check.end</b> <code>00:31.7</code><br><q>No calendar date, and no</q><small>The plate adds a line: No calendar date. No extra work. Hold the side-by-side to the end (33.7s).</small></figcaption></figure></main>
